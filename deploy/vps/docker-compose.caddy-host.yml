# RightToBeForgotten — Host-Caddy integration variant
#
# For servers where a **host-installed Caddy** (systemd service, NOT a Docker
# container) already owns ports 80/443 — e.g. the n8n stack on the same box.
# The two apps publish their internal :3000 on localhost-only host ports
# (3001/3002), and site blocks are appended to the HOST Caddyfile pointing at
# those ports. No docker network sharing is involved: Caddy reaches the apps
# via 127.0.0.1.
#
# Usage (from this directory):
#   cp .env.example .env          # edit NEXT_PUBLIC_* values
#   docker compose -f docker-compose.caddy-host.yml up -d --build
#
# Then append site blocks to the host Caddyfile (/etc/caddy/Caddyfile) and
# reload, e.g.:
#   vault.example.com {
#       encode zstd gzip
#       reverse_proxy 127.0.0.1:3001
#   }
#   verify.example.com {
#       encode zstd gzip
#       reverse_proxy 127.0.0.1:3002
#   }
#   sudo systemctl reload caddy
#
# Host port mapping: user-vault -> 127.0.0.1:3001, service-provider -> 127.0.0.1:3002.
# Only reachable from localhost — never exposed to the public internet directly.

services:
  user-vault:
    build:
      context: ../..
      dockerfile: deploy/vps/user-vault.Dockerfile
      args:
        NEXT_PUBLIC_POLYGON_AMOY_RPC: ${NEXT_PUBLIC_POLYGON_AMOY_RPC:-https://polygon-amoy.drpc.org}
        NEXT_PUBLIC_CONSENT_REGISTRY_ADDRESS: ${NEXT_PUBLIC_CONSENT_REGISTRY_ADDRESS:?set in .env}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-demo}
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  service-provider:
    build:
      context: ../..
      dockerfile: deploy/vps/service-provider.Dockerfile
      args:
        NEXT_PUBLIC_POLYGON_AMOY_RPC: ${NEXT_PUBLIC_POLYGON_AMOY_RPC:-https://polygon-amoy.drpc.org}
        NEXT_PUBLIC_CONSENT_REGISTRY_ADDRESS: ${NEXT_PUBLIC_CONSENT_REGISTRY_ADDRESS:?set in .env}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-demo}
    ports:
      - "127.0.0.1:3002:3000"
    restart: unless-stopped
